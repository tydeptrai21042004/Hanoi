[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-proposal-blind-watermark"
version = "2.4.0"
description = "Unified watermark research package with nine proposals, baselines and attacks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "Pillow>=10.0",
  "numba>=0.60",
  "scikit-image>=0.24",
  "pandas>=2.2",
  "reportlab>=4.0",
  "opencv-python-headless>=4.8",
  "PyWavelets>=1.5"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qr64_certified.baselines" = ["evidence/*.yaml"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
